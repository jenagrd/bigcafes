<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIGCHEFS - الرئيسية</title>
    
    <!-- Lüks Google Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Cairo', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            scroll-behavior: smooth;
        }

        /* Kırmızı Üst Header */
        header {
            background-color: #d6132d;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header-menu-link {
            color: white;
            background-color: rgba(0,0,0,0.2);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .header-menu-link:hover {
            background-color: rgba(0,0,0,0.4);
        }

        /* Giriş Bölümü Fotoğrafı */
        .hero-banner {
            width: 100%;
            height: 260px;
            position: relative;
            overflow: hidden;
        }

        .hero-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.25), rgba(18,18,18,0.9));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        .hero-overlay h2 {
            font-size: 32px;
            color: #ffbb00;
            margin: 0 0 8px 0;
            font-family: 'Playfair Display', serif;
        }

        .hero-overlay p {
            font-size: 16px;
            color: #cccccc;
            margin: 0;
        }

        /* Kategoriler Alanı */
        main {
            padding: 35px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Canlı Arka Planlı Net Fotoğraflı Kartlar */
        .category-card {
            width: 100%;
            height: 130px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
            text-decoration: none;
            color: white;
            background-size: cover;
            background-position: center;
            transition: transform 0.3s, border-color 0.3s;
        }

        .category-card:hover {
            border-color: #d6132d;
            transform: translateY(-3px);
        }

        /* Tatlılar kartına doğrudan kek/pasta fotoğrafı eklendi */
        .card-desserts {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=800&auto=format&fit=crop');
        }

        .card-breakfast {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://images.unsplash.com/photo-1533089860892-a7c6f0a88666?q=80&w=800&auto=format&fit=crop');
        }

        .card-burger {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=800&auto=format&fit=crop');
        }

        .card-drinks {
            background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?q=80&w=800&auto=format&fit=crop');
        }

        .category-title {
            font-size: 24px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.8);
        }

        .category-arrow {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
        }

        /* Alt İletişim & Konum Alanı */
        footer {
            background-color: #0a0a0a;
            color: #aaaaaa;
            text-align: center;
            padding: 35px 20px;
            margin-top: 50px;
            border-top: 1px solid #222;
        }

        .footer-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-call {
            background-color: #d6132d;
            color: white;
        }

        .btn-map {
            background-color: #2a2a2a;
            color: #ffbb00;
            border: 1px solid #ffbb00;
        }

        .footer-btn:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <!-- Kırmızı Üst Banner -->
    <header>
        <a href="#kategoriler" class="header-menu-link">القائمة</a>
        <h1>BIGCHEFS</h1>
    </header>

    <!-- Giriş Bölümü Fotoğrafı -->
    <section class="hero-banner">
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1200&auto=format&fit=crop" alt="Delicious Food">
        <div class="hero-overlay">
            <h2>أهلاً بكم في بيج شيفز</h2>
            <p>اختر القسم لتصفح قائمة الطعام الشهية</p>
        </div>
    </section>

    <!-- Kategoriler Alanı -->
    <main id="kategoriler">
        <div class="category-grid">
            
            <!-- Tatlılar (Kek Fotoğrafı) -->
            <a href="tatlilar.html" class="category-card card-desserts">
                <span class="category-title">الحلويات</span>
                <span class="category-arrow">➔</span>
            </a>

            <!-- Kahvaltı -->
            <a href="kahvalti.html" class="category-card card-breakfast">
                <span class="category-title">الإفطار</span>
                <span class="category-arrow">➔</span>
            </a>

            <!-- Ana Yemekler / Burger -->
            <a href="burger.html" class="category-card card-burger">
                <span class="category-title">البرجر والأطباق الرئيسية</span>
                <span class="category-arrow">➔</span>
            </a>

            <!-- İçecekler -->
            <a href="icecekler.html" class="category-card card-drinks">
                <span class="category-title">المشروبات</span>
                <span class="category-arrow">➔</span>
            </a>

        </div>
    </main>

    <!-- Alt İletişim & Konum Alanı -->
    <footer>
        <div class="footer-buttons">
            <a href="tel:+218900000000" class="footer-btn btn-call">اتصل بنا </a>
            <a href="https://maps.google.com" target="_blank" class="footer-btn btn-map">الموقع </a>
        </div>
        <p style="margin: 0; font-size: 13px;">Big Chefs Tripoli - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
